<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Harbor Care coordinated-care journey</title><desc id="desc">A patient booking moves to doctor consultation and prescription, pharmacist fulfillment, then a patient-visible status update.</desc><style>text{font-family:Arial,sans-serif;fill:#374151}.h{font-size:28px;font-weight:bold;fill:#1e40af}.b{font-size:19px;font-weight:bold}.s{font-size:15px;fill:#64748b}.a{stroke:#1e3a5f;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1e3a5f"/></marker></defs><rect width="1200" height="420" fill="white"/><text x="50" y="55" class="h">A synthetic care relay with role boundaries</text><line x1="170" y1="205" x2="1030" y2="205" class="a"/><circle cx="150" cy="205" r="58" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><text x="111" y="199" class="b">Patient</text><text x="102" y="225" class="s">books</text><rect x="330" y="145" width="190" height="120" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/><text x="365" y="192" class="b">Doctor</text><text x="349" y="220" class="s">consults + prescribes</text><rect x="690" y="145" width="190" height="120" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><text x="712" y="192" class="b">Pharmacist</text><text x="720" y="220" class="s">fulfills safely</text><circle cx="1050" cy="205" r="58" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><text x="1011" y="199" class="b">Patient</text><text x="996" y="225" class="s">sees status</text><text x="300" y="315" class="s">Role and ownership checks protect each handoff. Shared synthetic data resets daily.</text></svg>
