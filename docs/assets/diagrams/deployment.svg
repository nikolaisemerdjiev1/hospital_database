<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Harbor Care deployment</title><desc id="desc">Browser uses Auth0 and one Azure Container Apps origin. The combined application uses Neon and RxNorm; GitHub Actions releases the image and maintains the synthetic reset.</desc><style>text{font-family:Arial,sans-serif;fill:#374151} .h{font-size:28px;font-weight:bold;fill:#1e40af}.b{font-size:18px}.s{font-size:15px;fill:#64748b}.box{stroke-width:2;rx:14}.a{stroke:#1e3a5f;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1e3a5f"/></marker></defs><rect width="1200" height="520" fill="white"/><text x="48" y="56" class="h">One origin, guarded maintenance</text><rect x="55" y="150" width="175" height="100" class="box" fill="#fed7aa" stroke="#c2410c"/><text x="104" y="195" class="b">Browser</text><text x="82" y="222" class="s">React SPA</text><rect x="330" y="105" width="245" height="145" class="box" fill="#dbeafe" stroke="#1e40af"/><text x="362" y="160" class="b">Azure Container Apps</text><text x="372" y="190" class="s">ASP.NET Core + SPA + API</text><text x="394" y="215" class="s">single public origin</text><rect x="680" y="80" width="180" height="95" class="box" fill="#a7f3d0" stroke="#047857"/><text x="739" y="125" class="b">Neon</text><text x="705" y="150" class="s">PostgreSQL</text><rect x="680" y="275" width="180" height="95" class="box" fill="#93c5fd" stroke="#1e3a5f"/><text x="733" y="320" class="b">RxNorm</text><text x="711" y="345" class="s">medication search</text><rect x="330" y="350" width="245" height="105" class="box" fill="#fef3c7" stroke="#b45309"/><text x="365" y="395" class="b">GitHub Actions / GHCR</text><text x="365" y="420" class="s">OIDC, scanned image, reset</text><rect x="55" y="330" width="175" height="90" class="box" fill="#ddd6fe" stroke="#6d28d9"/><text x="100" y="370" class="b">Auth0</text><text x="82" y="395" class="s">Universal Login</text><line x1="230" y1="200" x2="330" y2="180" class="a"/><line x1="230" y1="370" x2="330" y2="205" class="a"/><line x1="575" y1="165" x2="680" y2="125" class="a"/><line x1="575" y1="205" x2="680" y2="320" class="a"/><line x1="450" y1="350" x2="450" y2="250" class="a"/></svg>
